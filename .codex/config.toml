# ~/.codex/config.toml は Codex 自身が実行のたびに書き換える
# （projects の trust_level、hooks.state のハッシュ、tui の NUX 状態など）。
# そのため symlink はせず、値を変えたときにこのファイルと
# ~/.codex/config.toml の両方を手動で更新する運用にする。

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "default"

# ワークスペース内の read/write/コマンド実行は承認なしで進める。
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[tui]
vim_mode_default = true
alternate_screen = "always"
notifications = true

# project-rootはworktree内ではworktree名を返しgit-branchと重複するため含めない。
status_line = ["model-with-reasoning", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.keymap.composer]
submit = ["ctrl-enter"]

[notice]
hide_full_access_warning = true

[desktop]
followUpQueueMode = "steer"
