[tasks.init]
dependencies = ["install", "switch"]

[tasks.install]
script = '''
sh install/install.sh
'''

[tasks.switch]
script = '''
# 初回は flakes が無効なので、NIX_CONFIG で有効にする。
# --extra-experimental-features は home-manager 内部の nix に引き継がれない。
NIX_CONFIG='experimental-features = nix-command flakes' \
DOTFILES_DIR="$(git rev-parse --show-toplevel)" nix run home-manager -- switch --flake ".#$(whoami)" --impure ${@}
'''
